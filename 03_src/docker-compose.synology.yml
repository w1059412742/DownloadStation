version: '3.8'

services:
  downloadstation:
    image: your-private-registry/downloadstation:latest  # 请修改为您的私有仓库地址
    container_name: downloadstation
    restart: always
    ports:
      - "20000:8080"
    volumes:
      # 1. 核心数据持久化 (数据库、上传的图片、日志等)
      # 请将宿主机路径修改为您群晖上的实际路径，例如 /volume1/docker/downloadstation/data
      - ./data:/app/data
      
      # 2. 软件库物理存放路径
      # 这个是您用来存放安装包的文件夹
      # 请将宿主机路径修改为您群晖上的实际路径，例如 /volume1/Software
      - ./software_repo:/data/software
      
    environment:
      - TZ=Asia/Shanghai
      # 如果需要自定义密钥，可以在这里覆盖
      - AppSettings__JwtSecret=YOUR_OWN_SECURE_RANDOM_SECRET_KEY
